algorithms:
  FSVC:
    params:
      sample_rate: 16000
      watermark_length: 40
      alpha: 0.04
      gamma1: 0.16
      gamma2: 0.4

datasets:
  - AudioFolderDataset:
      path: tests/audio/data/
      sample_rate: 16000

attacks:
  - WienerFilter:
      report_name: soft
      n_fft: 1024
      hop_length: 256
      noise_quantile: 0.10
      strength: 1.0
      floor: 0.05
      smoothing: 5
  - WienerFilter:
      report_name: aggressive
      n_fft: 1024
      hop_length: 256
      noise_quantile: 0.20
      strength: 2.0
      floor: 0.01
      smoothing: 9

pipeline:
  result_path: ./test_results/tests/wiener_filter
  aggregators:
    - CSV:
        table_name: table
