algorithms:
  FSVC:
    params:
      sample_rate: 16000
      watermark_length: 40
      alpha: 0.04
      gamma1: 0.16
      gamma2: 0.4

datasets:
  - AudioFolderDataset:
      path: tests/audio/data/
      sample_rate: 16000

attacks:
  - GTCRN:
      device: cpu
      download_progress: false

pipeline:
  result_path: ./test_results/tests/gtcrn
  aggregators:
    - CSV:
        table_name: table
