algorithms:
  FSVC:
    params:
      sample_rate: 16000
      watermark_length: 40
      alpha: 0.04
      gamma1: 0.16
      gamma2: 0.4

datasets:
  - AudioFolderDataset:
      path: tests/audio/data/
      sample_rate: 16000

attacks:
  - Gain:
      report_name: -6db
      gain_db: -6
      clip: True
  - Gain:
      report_name: -3db
      gain_db: -3
      clip: False
  - Gain:
      report_name: +3db
      gain_db: 3
      clip: False
  - Gain:
      report_name: +6db
      gain_db: 6
      clip: True

pipeline:
  result_path: ./test_results/tests/gain
  aggregators:
    - CSV:
        table_name: table