algorithms:
  FSVC:
    params:
      sample_rate: 16000
      watermark_length: 40
      alpha: 0.04
      gamma1: 0.16
      gamma2: 0.4

datasets:
  - AudioFolderDataset:
      path: tests/audio/data/
      sample_rate: 16000

attacks:
  - EnCodec:
      report_name: encodec_1_5k
      bandwidth: 1.5
      device: cpu
  - EnCodec:
      report_name: encodec_6k
      bandwidth: 6
      device: cpu
  - EnCodec:
      report_name: encodec_24k
      bandwidth: 24
      device: cpu

pipeline:
  result_path: ./test_results/tests/encodec
  aggregators:
    - CSV:
        table_name: table
