algorithms:
  FSVC:
    params:
      sample_rate: 16000
      watermark_length: 40
      alpha: 0.04
      gamma1: 0.16
      gamma2: 0.4

datasets:
  - AudioFolderDataset:
      path: tests/audio/data/
      sample_rate: 16000

attacks:
  - Crop:
      duration_ms: 100
      mode: start
  - Crop:
      duration_ms: 100
      mode: end
  - Crop:
      duration_ms: 100
      mode: random

pipeline:
  result_path: ./test_results/tests/crop
  aggregators:
    - CSV:
        table_name: table
