algorithms:
  FSVC:
    params:
      sample_rate: 16000
      watermark_length: 40
      alpha: 0.04
      gamma1: 0.16
      gamma2: 0.4

datasets:
  - AudioFolderDataset:
      path: tests/audio/data/
      sample_rate: 16000

attacks:
  - ReplacementAttack:
      block_size: 1024
      overlap_factor: 0.75
      lower_bound: 0
      upper_bound: 10
      k: 100
      use_masking: False
      search_window_sec: 0.0
      search_dims: 0
      tile_size: 256

pipeline:
  result_path: ./test_results/tests/replacement_attack
  aggregators:
    - CSV:
        table_name: table
