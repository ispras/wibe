algorithms:
  FSVC:
    params:
      sample_rate: 16000
      watermark_length: 40
      alpha: 0.04
      gamma1: 0.16
      gamma2: 0.4

datasets:
  - AudioFolderDataset:
      path: tests/audio/data/
      sample_rate: 16000

attacks:
  - AAC:
        report_name: aac_256
        bitrate: 256
  - AAC:
        report_name: aac_16
        bitrate: 16

pipeline:
  result_path: ./test_results/tests/aac
  aggregators:
    - CSV:
        table_name: table