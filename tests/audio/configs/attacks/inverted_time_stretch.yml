algorithms:
  FSVC:
    params:
      sample_rate: 16000
      watermark_length: 40
      alpha: 0.04
      gamma1: 0.16
      gamma2: 0.4

datasets:
  - AudioFolderDataset:
      path: tests/audio/data/
      sample_rate: 16000

attacks:
  - InvertedTimeStretch:
      rate: 0.8

pipeline:
  result_path: ./test_results/tests/inverted_time_stretch
  aggregators:
    - CSV:
        table_name: table
