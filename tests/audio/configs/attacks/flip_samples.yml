algorithms:
  FSVC:
    params:
      sample_rate: 16000
      watermark_length: 40
      alpha: 0.04
      gamma1: 0.16
      gamma2: 0.4

datasets:
  - AudioFolderDataset:
      path: tests/audio/data/
      sample_rate: 16000

attacks:
  - FlipSamples:
      num_flips: 100
      duration: 0.5

pipeline:
  result_path: ./test_results/tests/flip_samples
  aggregators:
    - CSV:
        table_name: table
