algorithms:
  FSVC:
    params:
      sample_rate: 16000
      watermark_length: 40
      alpha: 0.04
      gamma1: 0.16
      gamma2: 0.4

datasets:
  - AudioFolderDataset:
      path: tests/audio/data/
      sample_rate: 16000

attacks:
  - ZeroCrossInserts:
      pause_length: 20
      min_distance: 1.0

pipeline:
  result_path: ./test_results/tests/zero_cross_inserts
  aggregators:
    - CSV:
        table_name: table
