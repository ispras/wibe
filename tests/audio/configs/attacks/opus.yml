algorithms:
  FSVC:
    params:
      sample_rate: 16000
      watermark_length: 40
      alpha: 0.04
      gamma1: 0.16
      gamma2: 0.4

datasets:
  - AudioFolderDataset:
      path: tests/audio/data/
      sample_rate: 16000

attacks:
  - Opus:
        report_name: opus_32
        bitrate: 24
  - Opus:
        report_name: opus_64
        bitrate: 64
  - Opus:
        report_name: opus_128
        bitrate: 128

pipeline:
  result_path: ./test_results/tests/opus
  aggregators:
    - CSV:
        table_name: table