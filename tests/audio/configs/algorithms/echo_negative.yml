algorithms:
  EchoHidingNegative:
    params:
      sample_rate: 16000
      watermark_length: 16
      frame_length: 512
      overlap: 0.5
      control_strength: 0.2
      num_reps: 3
      seed: 12345
      delay11: 100
      delay10: 110
      delay01: 120
      delay00: 130
      negative_delay: 4

datasets:
  - AudioFolderDataset:
      path: tests/audio/data/
      sample_rate: 16000

attacks:
  - Identity

pipeline:
  result_path: ./test_results/tests/echo_negative
  aggregators:
    - CSV:
        table_name: table