algorithms:
  FSVC:
    params:
      sample_rate: 16000
      watermark_length: 40
      alpha: 0.04
      gamma1: 0.16
      gamma2: 0.4

post_embed_metrics:
  - STOI

datasets:
  - AudioFolderDataset:
      path: tests/audio/data/
      sample_rate: 16000

attacks:
  - Noise:
      snr_db: 20

pipeline:
  result_path: ./test_results/tests/stoi
  aggregators:
    - CSV:
        table_name: table
