algorithms:
  dct_marker

datasets:
  ImageFolderDataset:
    path: tests/data

attacks:
  - JPEG:
      report_name: jpeg_80
      quality: 80
  - JPEG:
      report_name: jpeg_1
      quality: 1
  
post_extract_metrics:
  empiricaltpr@xfpr:
    algorithm: dct_marker
    fpr_rate: 0.1
    dataset: diffusiondb
    dataset_params:
      subset: 2m_random_1k
    method_type: multi-bit

pipeline:
  result_path: ./test_results/tests/empirical_tpr@xfpr_multibit
  aggregators:
    - CSV:
        table_name: table
