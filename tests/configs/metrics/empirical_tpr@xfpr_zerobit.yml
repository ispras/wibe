algorithms:
  ssl_watermarking:
    params:
      method: zero-bit

datasets:
  ImageFolderDataset:
    path: tests/data

attacks:
  - JPEG:
      report_name: jpeg_80
      quality: 80
  - JPEG:
      report_name: jpeg_1
      quality: 1
  
post_extract_metrics:
  empiricaltpr@xfpr:
    algorithm: ssl_watermarking
    algorithm_params:
      params:
        method: zero-bit
    fpr_rate: 0.1
    dataset: diffusiondb
    dataset_params:
      subset: 2m_random_1k
    larger_is_better: false

pipeline:
  result_path: ./test_results/tests/empirical_tpr@xfpr_zerobit
  aggregators:
    - CSV:
        table_name: table
