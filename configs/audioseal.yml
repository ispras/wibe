algorithms:
  audioseal:
    params:
      device: cpu

post_embed_metrics:
  - SI_SNR
  - PESQ
  - STOI
  - NISQA
  - DNSMOS
  - SECS

post_extract_metrics:
  - ExtWm
  - BER
  - WER
  - TPR@xFPR:
      report_name: tpr@10e-2fpr
      fpr_rate: 0.01

datasets:
  # - AudioFolderDataset:
  #     path: /home/do-op/Projects/docmarking/dm-audio/dataset/classic-v1/
  #     sample_rate: 16000
  # - AudioSet:
  #     cache_dir: /media/do-op/75003b47-88db-474a-8a2a-dcd2d5f6f059/data/AudioSet/
  #     subset: balanced
  #     split: test
  - LibriSpeech:
      cache_dir: /media/do-op/75003b47-88db-474a-8a2a-dcd2d5f6f059/data/LibriSpeech/
      subset: all
      split: validation.clean

attacks:
  - Identity
  - Resampling:
      report_name: scaling_8k
      target_rate: 8000
  - Resampling:
      report_name: scaling_16k
      target_rate: 16000
  - Requantization:
      report_name: requantize_float16
      target_dtype: float16
  - Scaling:
      report_name: scaling_09
      factor: 0.9
  - Scaling:
      report_name: scaling_11
      factor: 1.1
  - Noise:
      report_name: noise_20
      snr_db: 20
  - Noise:
      report_name: noise_30
      snr_db: 30
  - Noise:
      report_name: noise_40
      snr_db: 40
  - Filter:
      report_name: lowpass_4k
      filter_type: lowpass
      freq_1: 4000
  - Filter:
      report_name: lowpass_6k
      filter_type: lowpass
      freq_1: 6000
  - Filter:
      report_name: lowpass_8k
      filter_type: lowpass
      freq_1: 3000
  - Filter:
      report_name: highpass_250
      filter_type: highpass
      freq_1: 250
  - Filter:
      report_name: highpass_500
      filter_type: highpass
      freq_1: 500
  - Filter:
      report_name: highpass_1k
      filter_type: highpass
      freq_1: 1000

pipeline:
  result_path: ./test_results/audioseal
  aggregators:
    - CSV:
        table_name: table