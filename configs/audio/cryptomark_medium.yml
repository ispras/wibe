algorithms:
  cryptomark:
    params:
      profile: hard
      target_rate: 16000

post_embed_metrics:
  - SI_SNR
  - PESQ
  - STOI
  - NISQA
  - DNSMOS
  # - SECS

post_extract_metrics:
  - ExtWm
  - BER
  - WER

datasets:
  - LibriSpeech:
      report_name: ls_test_clean
      cache_dir: /media/do-op/75003b47-88db-474a-8a2a-dcd2d5f6f059/data/LibriSpeech/
      subset: all
      split: test.clean
      sample_range: [0, 2500]
  - LibriSpeech:
      report_name: ls_test_other
      cache_dir: /media/do-op/75003b47-88db-474a-8a2a-dcd2d5f6f059/data/LibriSpeech/
      subset: all
      split: test.other
      sample_range: [0, 2500]

attacks:
{% include 'audio/distortions.yml' %}

pipeline:
  result_path: ./test_results/cryptomark
  aggregators:
    - CSV:
        table_name: table_hard
