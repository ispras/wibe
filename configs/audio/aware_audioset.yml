      report_name: etpr@10e-1fpr
      fpr_rate: 0.1
      algorithm: aware
      algorithm_params:
        params:
          device: cpu
      dataset: audioset
      dataset_params:
        cache_dir: /media/do-op/75003b47-88db-474a-8a2a-dcd2d5f6f059/data/HF-cache/
        subset: balanced
        split: test
        sample_range: [0, 99]
      random_extracts_path: "./random_audioset_extracts_0.1.csv"
      method_type: multibit
