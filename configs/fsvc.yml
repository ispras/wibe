algorithms:
  FSVC:
    params:
      sample_rate: 16000
      watermark_length: 40
      alpha: 0.04
      gamma1: 0.16
      gamma2: 0.4

post_embed_metrics:
  - SI_SNR
  - PESQ
  - STOI
  # - NISQA
  # - DNSMOS
  # - SECS

post_extract_metrics:
  - ExtWm
  - BER
  - WER

datasets:
  - LibriSpeech:
      cache_dir: /fast-drive/redkin.d/hf_cache/librispeech
      subset: other
      split: test
      sample_range: [0, 2500]
  - LibriSpeech:
      cache_dir: /fast-drive/redkin.d/hf_cache/librispeech
      subset: clean
      split: test
      sample_range: [0, 2500]

attacks:
{% include 'common/audio_distortions.yml' %}

pipeline:
  result_path: ./test_results/fsvc
  aggregators:
    - CSV:
        table_name: table_bands_search
