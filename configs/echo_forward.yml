algorithms:
  EchoForward:
    params:
      sample_rate: 16000
      watermark_length: 40
      frame_length: 1024
      overlap: 0.5
      control_strength: 0.2
      num_reps: 3
      seed: 12345
      delay11: 100
      delay10: 110
      delay01: 120
      delay00: 130
      negative_delay: 4
      log_floor: 1e-05

post_embed_metrics:
  - SI_SNR
  - PESQ
  - STOI
  - NISQA
  - DNSMOS
  - SECS

post_extract_metrics:
  - ExtWm
  - BER
  - WER

datasets:
  - LibriSpeech:
      report_name: ls_test_other
      cache_dir: /media/do-op/75003b47-88db-474a-8a2a-dcd2d5f6f059/data/LibriSpeech/
      subset: all
      split: test.other
      sample_range: [0, 10]

attacks:
{% include 'common/band_filters.yml' %}

pipeline:
  result_path: ./test_results/echo_forward
  aggregators:
    - CSV:
        table_name: table_bands_search
